name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      KP_PROVIDER: mock
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install setuptools wheel -e .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          PYTHONPATH: src
      - run: ezkb-builder --workspace "$RUNNER_TEMP/kp-demo" --provider mock demo
